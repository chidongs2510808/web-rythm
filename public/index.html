<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Neon Rhythm Duel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #0b0c10; 
            color: #66fcf1; 
            font-family: 'Orbitron', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            overflow: hidden;
        }
        h1 { text-shadow: 0 0 10px #66fcf1; letter-spacing: 2px; margin-bottom: 5px; }
        #status { font-size: 18px; color: #c5c6c7; margin-bottom: 20px; height: 20px; }
        
        #game-wrapper { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 40px; 
        }
        
        canvas { 
            background: #1f2833; 
            border: 3px solid #45a29e; 
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(69, 162, 158, 0.5);
        }
        
        .hud { 
            width: 180px; 
            background: rgba(31, 40, 51, 0.8); 
            padding: 20px; 
            border: 2px solid #45a29e; 
            border-radius: 12px; 
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
            text-align: left;
        }
        .hud h3 { margin-top: 0; color: #fff; text-align: center; border-bottom: 1px solid #45a29e; padding-bottom: 10px; }
        .hud p { font-size: 16px; margin: 15px 0; color: #c5c6c7; }
        .score-val { font-size: 24px; font-weight: bold; color: #66fcf1; float: right; }
        .combo-val { font-size: 24px; font-weight: bold; color: #ffeb3b; float: right; }
        
        .controls { margin-top: 20px; color: #c5c6c7; font-size: 14px; }
        .key { display: inline-block; background: #45a29e; color: #0b0c10; padding: 5px 10px; border-radius: 4px; font-weight: bold; margin: 0 5px; }
    </style>
</head>
<body>
    <h1>NEON RHYTHM DUEL</h1>
    <div id="status">서버 연결 중...</div>

    <div id="game-wrapper">
        <!-- 내 점수판 -->
        <div class="hud">
            <h3>PLAYER (ME)</h3>
            <p>SCORE <span id="my-score" class="score-val">0</span></p>
            <p>COMBO <span id="my-combo" class="combo-val">0</span></p>
        </div>

        <canvas id="gameCanvas" width="360" height="600"></canvas>

        <!-- 상대 점수판 -->
        <div class="hud">
            <h3>OPPONENT</h3>
            <p>SCORE <span id="op-score" class="score-val">0</span></p>
            <p>COMBO <span id="op-combo" class="combo-val">0</span></p>
        </div>
    </div>

    <div class="controls">
        조작키: <span class="key">D</span> <span class="key">F</span> <span class="key">J</span> <span class="key">K</span>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
